<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Card source: Bee's Sound Garden adventure cards</title>
<!--
  Source for the Bee's Sound Garden adventure cards. Same 5:7 poker shape as
  Find Every Key (1080x1512 px, 2.5x3.5 in at 432 dpi) so both decks cut and
  stack together, but a warmer, doodlier background because this deck is an
  improv tool, not a drill.

  Two decks come out of the same source:
    deck=art    one simple scene per card, composed from the real app art
                (Bees Keys bee, Interval Jump bugs/frog/plants in
                sound-garden-art/) plus a few flat
                SVG creatures drawn here for the ones the apps don't have.
    deck=color  the same card with a blank white square for the student to
                draw and color their own scene.

  Scene rules (Josh, Aug 26 2026): app art is used as-is, never re-outlined;
  nothing floats, creatures stand on the meadow or on a mound raised to meet
  them; only things that fly or fall are in the air.

  Query params:
    ?n=3&t=Spider%20Climbs%20Her%20Web&s=Creep%20HIGHER...&c=purple&deck=art
      n     card number; picks the scene (never printed)
      t     title
      s     subtitle: one short line giving the shape; HIGH and LOW in caps
            get the accent color
      c     accent: yellow | pink | green | blue | purple
      deck  art | color (default art)
      art   optional image path; overrides the built-in scene
      src   directory for the scene images (default sound-garden-art/)
    ?back=1   the shared deck back

  Rendered by tools/make-sound-garden-cards.py (headless Chrome, then pymupdf).
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  :root {
    --ink: #232323;
    --yellow: #f5b81f;
    --pink: #e8528c;
    --green: #6cb33f;
    --blue: #3f9ae6;
    --purple: #8a66ad;
    --accent: var(--blue);
    --accent-soft: rgba(63,154,230,.16);
  }
  .c-yellow { --accent: var(--yellow); --accent-soft: rgba(245,184,31,.20); }
  .c-pink   { --accent: var(--pink);   --accent-soft: rgba(232,82,140,.16); }
  .c-green  { --accent: var(--green);  --accent-soft: rgba(108,179,63,.18); }
  .c-blue   { --accent: var(--blue);   --accent-soft: rgba(63,154,230,.16); }
  .c-purple { --accent: var(--purple); --accent-soft: rgba(138,102,173,.16); }

  body {
    width: 1080px;
    height: 1512px;
    overflow: hidden;
    background: #fff;
    font-family: 'Nunito', 'Avenir Next', 'Arial Rounded MT Bold', sans-serif;
    color: var(--ink);
  }

  .card {
    position: relative;
    width: 1080px;
    height: 1512px;
    overflow: hidden;
    border-radius: 44px;
    background:
      radial-gradient(1200px 700px at 50% -260px, #fff9e3 0%, rgba(255,249,227,0) 70%),
      linear-gradient(180deg, #fefefe 0%, #eef7fd 55%, #dbeffb 100%);
  }

  /* Faint inner frame, same as the Find Every Key cards. */
  .card::after {
    content: "";
    position: absolute;
    inset: 18px;
    border-radius: 30px;
    border: 3px solid var(--accent-soft);
    pointer-events: none;
    z-index: 9;
  }

  /* ---- background doodles ---- */
  .doodles { position: absolute; inset: 0; z-index: 0; }
  .doodles svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .flight { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 2 26; opacity: .75; }
  .spark { fill: var(--accent); opacity: .55; }
  .hex { fill: none; stroke: var(--accent); stroke-width: 5; opacity: .22; }
  .hill-back { fill: #cfe9a4; }
  .hill-front { fill: #b3dc7f; }
  .grass { fill: none; stroke: #6cb33f; stroke-width: 6; stroke-linecap: round; opacity: .8; }

  /* Underground cards: the meadow gives way to a turf line about three
     quarters down, with a brown dirt layer below it for the diggers. */
  .digs { display: none; }
  .underground .digs { display: block; }
  .underground .meadow, .underground .spark.low { display: none; }
  .dirt { fill: #9b6a3c; }
  .pebble { fill: #6f4a28; opacity: .45; }
  .underground .brand { color: #fff; text-shadow: 0 2px 0 rgba(58,36,16,.45); }

  /* ---- foreground ---- */
  .inner { position: relative; z-index: 2; height: 100%; }

  .title {
    position: absolute;
    left: 80px; right: 80px;
    top: 190px;
    text-align: center;
    font-size: 118px;
    font-weight: 900;
    line-height: 1.02;
    letter-spacing: -.015em;
    color: var(--ink);
    text-shadow: 0 2px 0 rgba(255,255,255,.7);
  }
  .title.long { font-size: 100px; }
  .title.xlong { font-size: 86px; }

  .subtitle {
    position: absolute;
    left: 90px; right: 90px;
    top: 460px;
    text-align: center;
    font-size: 46px;
    font-weight: 800;
    line-height: 1.25;
    color: #4a4a4a;
  }
  .subtitle b { color: var(--accent); font-weight: 900; }

  /* The scene box: 860 wide, from under the subtitle down onto the meadow
     (card y 625..1325). Ground line for feet is GROUND (690) in box coords,
     which lands on the back hill of the meadow. */
  .art {
    position: absolute;
    left: 110px; top: 625px;
    width: 860px; height: 700px;
    display: grid; place-items: center;
  }
  .art img.single { max-width: 100%; max-height: 100%; }

  .art .layer { position: absolute; transform-origin: center; }
  /* Scenes with a tree: clip at the top edge so the trunk reads as continuing
     up without running into the subtitle. */
  .art.clip { overflow: hidden; }
  .art .layer img, .art .layer svg { display: block; width: 100%; height: 100%; }

  /* Color-your-own deck: a clean white square, no label. */
  .art.blank {
    height: 640px;
    background: #fff;
    border: 5px solid var(--accent-soft);
    border-radius: 36px;
    box-shadow: 0 6px 0 rgba(0,0,0,.05);
  }

  .brand {
    position: absolute;
    left: 0; right: 0; bottom: 74px;
    text-align: center;
    font-size: 60px; font-weight: 900; line-height: .95;
    letter-spacing: -.01em;
    text-shadow: 0 1px 0 rgba(255,255,255,.5);
  }

  /* ---- night cards: dusk sky, pale doodles, moon and stars carry the scene ---- */
  .night {
    background:
      radial-gradient(900px 500px at 50% -200px, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 70%),
      linear-gradient(180deg, #5f83c9 0%, #8fb0e4 52%, #c6daf4 100%);
  }
  .night .spark, .night .hex { stroke: #fff; fill: #fff; opacity: .55; }
  .night .flight { display: none; }   /* white on dusk reads as a smear, not a path */
  .night .spark { stroke: none; }
  .night .hex { fill: none; }
  .night .title { text-shadow: 0 2px 0 rgba(255,255,255,.35); }
  .night .subtitle { color: #2f3a4d; }
  .night.c-green .subtitle b { color: #fff; }   /* Sleepy Frog: LOW in white, not green */

  /* ---- deck back ---- */
  .back .title { top: 560px; font-size: 150px; line-height: 1; }
  .back .kicker {
    position: absolute; left: 0; right: 0; top: 1060px;
    text-align: center;
    font-size: 64px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent);
  }
  .back .bee { position: absolute; left: 50%; top: 170px; width: 330px; transform: translateX(-50%) rotate(-10deg); }
  .back .flight-back { display: block; }
  .flight-back { display: none; }
  .back .flight { stroke-width: 8; }

  /* ---- drawn creatures: flat fills, dark outline, same weight as the frog ---- */
  .cr { stroke: #232323; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .cr:not([fill]) { fill: none; }
</style>
</head>

    <!-- The Bee's Color Garden daisy, redrawn from Josh's flower: 8 fat petals
         around a big round center, thin stem, two long leaves at the base.
         Petal color comes from the layer's `fill`. -->
    <symbol id="daisy" viewBox="0 0 200 262">

      <path class="cr" d="M104 244 C 120 206, 149 186, 190 184 C 174 222, 145 242, 104 244 Z" fill="#6cb33f"/>
      <path d="M92 241 C 70 226, 45 205, 17 188 M108 241 C 130 226, 155 205, 183 188"
            fill="none" stroke="#3d7a25" stroke-width="4" opacity=".7"/>
      <g class="cr" fill="currentColor">
        <ellipse cx="100" cy="37" rx="19" ry="32"/>

<div class="card c-blue" id="card">
  <div class="doodles">
    <svg viewBox="0 0 1080 1512" preserveAspectRatio="none" aria-hidden="true">
      <!-- meadow -->
      <path class="hill-back meadow" d="M-20 1330 C 200 1250, 420 1300, 560 1280 S 900 1200, 1100 1290 L1100 1540 L-20 1540 Z"/>
      <path class="hill-front meadow" d="M-20 1400 C 160 1340, 380 1380, 540 1360 S 880 1310, 1100 1390 L1100 1540 L-20 1540 Z"/>
      <path class="grass meadow" d="M120 1400 l 8 -46 M150 1405 l 14 -40 M700 1370 l 6 -44 M730 1372 l 16 -38 M960 1410 l 6 -46 M990 1412 l 14 -40"/>
      <!-- loop-de-loop flight path -->
      <path class="flight" d="M-40 1120 C 120 1010, 220 1090, 300 990 C 360 910, 260 850, 230 930 C 200 1010, 330 1040, 420 950 C 560 800, 700 860, 800 760 C 900 660, 980 720, 1120 620"/>

      <path class="flight flight-back" d="M1120 300 C 980 380, 900 240, 780 320 C 700 380, 760 470, 830 420 C 900 370, 820 300, 760 360"/>
      <path class="flight flight-back" d="M-40 560 C 100 500, 140 640, 260 580 C 340 540, 300 460, 240 500 C 180 540, 260 620, 360 560"/>
      <!-- sparkles and faint hexes -->
      <g class="spark">

      <g class="spark low">
        <path d="M150 1230 l 7 20 l 20 7 l -20 7 l -7 20 l -7 -20 l -20 -7 l 20 -7 z"/>
        <path d="M980 1060 l 8 22 l 22 8 l -22 8 l -8 22 l -8 -22 l -22 -8 l 22 -8 z"/>
      </g>
      <g class="hex">
        <path d="M1010 420 l 40 23 l 0 46 l -40 23 l -40 -23 l 0 -46 z"/>
        <path d="M60 760 l 34 20 l 0 40 l -34 20 l -34 -20 l 0 -40 z"/>
      </g>
      <!-- underground cards only: turf line at ~75% height, dirt below -->
      <g class="digs">
        <path class="hill-back"  d="M-20 715 C 200 635, 420 685, 560 665 S 900 585, 1100 675 L1100 1540 L-20 1540 Z"/>
        <path class="hill-front" d="M-20 785 C 160 725, 380 765, 540 745 S 880 695, 1100 775 L1100 1540 L-20 1540 Z"/>
        <path class="grass" d="M165 793 l 7 -40 M185 795 l 12 -34 M615 777 l 6 -38 M635 779 l 13 -32 M925 785 l 6 -40 M945 787 l 12 -34"/>
        <path class="dirt" d="M-20 840 C 160 780, 380 820, 540 800 S 880 750, 1100 830 L1100 1540 L-20 1540 Z"/>
        <g class="pebble">
          <ellipse cx="140" cy="995" rx="29" ry="19"/>
          <ellipse cx="955" cy="957" rx="23" ry="15"/>
          <ellipse cx="88" cy="1124" rx="26" ry="17"/>
          <ellipse cx="884" cy="1150" rx="30" ry="20"/>
          <ellipse cx="300" cy="1232" rx="22" ry="15"/>
          <ellipse cx="724" cy="1272" rx="28" ry="19"/>
          <ellipse cx="168" cy="1402" rx="24" ry="16"/>

    </svg>
  </div>

  <div class="inner">
    <h2 class="title" id="title">Bee Takes Flight</h2>
    <p class="subtitle" id="subtitle"></p>
    <div class="art" id="art"></div>
    <img class="bee" id="bee" src="../images/bee_icon.png" alt="" hidden />
    <p class="kicker" id="kicker" hidden>Adventure Cards</p>
    <div class="brand">Bees Keys</div>
  </div>
</div>

<script>
  // One scene per card, in the scene box's 860x700 coordinates.
  //   img: file in the scene image dir (width given, height from the image)
  //   sym: a symbol above (w and h given)
  //   y: top edge, or b: baseline (bottom edge). G is the ground line.
  //   r: rotation in degrees; flip: mirror so the creature faces right.
  const G = 690;
  const SCENES = {
    // Bee follows the dotted path up and to the right.
    1: [ {img:'river-flowers-1.png', x:580, b:G+34, w:260},
         {sym:'bee', x:10, y:110, w:460, h:387, r:-12, flip:true} ],
    2: [ {img:'sprout.png', x:200, b:G+24, w:470} ],
    // Long-branch tree on the left, web in the crook under the branch, spider in
    // the middle of it. Sized so the leaf on top of the branch stays on the card.
    3: [ {clip:true},
         {img:'tree-long.png', x:-54, b:G+24, w:810},
         {sym:'web', x:198, y:150, w:407, h:330},
         {img:'spider-drawn.png', x:261, y:279, w:280} ],
    4: [          {img:'ant.png', x:0,   b:G+8, w:280},
         {img:'ant.png', x:270, b:G+8, w:280},
         {img:'ant.png', x:540, b:G+8, w:280} ],
    // Josh's drawing: bloom, puffball and three seeds already flying, all in one.
    5: [ {img:'dandelion-scene.png', x:70, b:G+20, w:720} ],
    6: [ {img:'river-rock-cluster-1.png', x:580, b:G+6, w:260},
         {sym:'arc', x:150, b:G-40, w:600, h:430},
         {img:'grasshopper-drawn.png', x:0, b:G+10, w:580} ],
    // Bee heading down and to the right, toward the hive on the ground.
    // Hive hangs from a branch that runs off the right edge; sized so the hive
    // body and both leaves stay on the card and only the branch tip is cut.
    7: [ {clip:true},
         {img:'beehive.png', x:410, y:118, w:470},
         {sym:'bee', x:0, y:72, w:396, h:334, r:30, flip:true} ],
    8: [ {img:'leaf-orange.png', x:120, y:0,   w:200, r:-30},
         {img:'leaf-green.png',  x:520, y:60,  w:180, r:35},
         {img:'leaf-orange.png', x:300, y:230, w:190, r:80},
         {img:'leaf-green.png',  x:620, y:330, w:180, r:-60},
         {img:'leaf-orange.png', x:330, b:G+20, w:210, r:100} ],
    // Short-branch tree on the right, clipped tall; snail tilted up at its base.
    9: [ {clip:true},
         {img:'tree-short.png', x:370, b:G+24, w:480},
         {img:'snail-drawn.png', x:254, b:G-74, w:340, r:-50} ],
    10: [ {img:'river-flowers-2.png', x:40, b:G+34, w:280},
          {sym:'arc', x:200, b:G-40, w:520, h:380},
          {img:'ladybug.png', x:400, b:G+10, w:460} ],
    11: [ {img:'worm-drawn.png', x:210, y:220, w:440} ],
    12: [ {sym:'moon', x:40, y:0, w:150, h:150},
          {sym:'star', x:560, y:30, w:50, h:50}, {sym:'star', x:780, y:120, w:40, h:40},
          {img:'frog-sleeping.svg', x:230, b:G+34, w:420},
          {sym:'zzz', x:600, y:150, w:220, h:220} ],
    // 11 and 13 are underground: the diggers sit below the dirt line, so the
    // ground line G is unused on those two.
    13: [ {img:'river-rock-cluster-1.png', x:60,  b:130, w:150},
          {img:'river-rock-3.png',         x:700, b:104, w:80},
          {img:'beetle-drawn.png', x:245, y:220, w:370} ],
    14: [ {sym:'moon', x:660, y:0, w:170, h:170},
          {sym:'star', x:90, y:20, w:60, h:60}, {sym:'star', x:560, y:150, w:45, h:45},
          {img:'river-reeds-1.png', x:40, b:G+10, w:280},
          {img:'firefly-drawn.png', x:200, y:20, w:400, r:-15},
          {img:'firefly-drawn.png', x:520, y:250, w:330, r:15} ],
    15: [ {img:'frog-seated.svg', x:500, b:G+16, w:360},
          {img:'caterpillar.png', x:-10, b:G+10, w:520} ],
    16: [ {sym:'moon', x:60, y:0, w:150, h:150},
          {sym:'star', x:400, y:20, w:50, h:50}, {sym:'star', x:760, y:70, w:60, h:60},
          {img:'river-reeds-2.png', x:610, b:G+10, w:230},
          {img:'cricket-drawn.png', x:60, b:G+10, w:560} ],
    // Just rain: one size of drop, spread over the whole scene.
    17: [ {sym:'drop', x:90, y:60, w:78, h:78},
          {sym:'drop', x:420, y:30, w:84, h:84},
          {sym:'drop', x:730, y:90, w:74, h:74},
          {sym:'drop', x:200, y:250, w:72, h:72},
          {sym:'drop', x:560, y:250, w:82, h:82},
          {sym:'drop', x:80, y:470, w:70, h:70},
          {sym:'drop', x:390, y:470, w:76, h:76},
          {sym:'drop', x:690, y:500, w:74, h:74} ],
    18: [ {img:'river-flowers-1.png', x:520, b:G+34, w:320},
          {img:'butterfly.png', x:120, y:40, w:560} ],
  };

  const q = new URLSearchParams(location.search);
  const ART = q.get('src') || 'sound-garden-art/';
  const card = document.getElementById('card');
  const title = document.getElementById('title');
  const art = document.getElementById('art');
  const color = q.get('c') || 'blue';
  card.className = 'card c-' + color;

  function place(layer) {
    const el = document.createElement('div');
    el.className = 'layer';
    el.style.left = layer.x + 'px';
    if (layer.b !== undefined) el.style.bottom = (700 - layer.b) + 'px';
    else el.style.top = layer.y + 'px';
    el.style.width = layer.w + 'px';
    const t = [];
    if (layer.r) t.push('rotate(' + layer.r + 'deg)');
    if (layer.flip) t.push('scaleX(-1)');
    el.style.transform = t.join(' ');
    if (layer.img) {
      const img = document.createElement('img');
      img.src = ART + layer.img;
      el.appendChild(img);
    } else {
      el.style.height = layer.h + 'px';
      const vb = layer.sym === 'bee' ? '0 0 394.178 331.977' : layer.sym === 'daisy' ? '0 0 200 262' : '0 0 200 200';
      const par = ['web', 'soil', 'arc', 'shadow'].includes(layer.sym) ? ' preserveAspectRatio="none"' : '';
      const color = layer.fill ? ' style="color:' + layer.fill + '"' : '';
      el.innerHTML = '<svg viewBox="' + vb + '"' + par + color + '><use href="#' + layer.sym + '"/></svg>';
    }
    art.appendChild(el);
  }

  if (q.get('back')) {
    card.classList.add('back');
    art.hidden = true;
    document.getElementById('subtitle').hidden = true;
    title.innerHTML = "Bee's<br>Sound<br>Garden";
    document.getElementById('bee').hidden = false;
    document.getElementById('kicker').hidden = false;
  } else {
    const n = q.get('n') || '1';
    if (['12', '14', '16'].includes(n)) card.classList.add('night');
    if (['11', '13'].includes(n)) card.classList.add('underground');
    const t = q.get('t') || 'Bee Takes Flight';
    title.textContent = t;
    const longest = Math.max(...t.split(' ').map(w => w.length));
    if (t.length > 22 || longest > 10) title.classList.add('long');
    if (t.length > 30 || longest > 12) title.classList.add('xlong');
    const s = q.get('s') || '';
    document.getElementById('subtitle').innerHTML =
      s.replace(/[<>&]/g, '').replace(/\b(HIGH(?:ER|EST)?|LOW(?:ER|EST)?)\b/g, '<b>$1</b>');

    const deck = q.get('deck') || 'art';
    const src = q.get('art');
    if (deck === 'color') {
      art.classList.add('blank');
    } else if (src) {
      const img = document.createElement('img');
      img.className = 'single';
      img.src = src;
      art.appendChild(img);
    } else {
      const layers = SCENES[n] || [];
      if (layers.some(l => l.clip)) art.classList.add('clip');
      layers.filter(l => !l.clip).forEach(place);
    }
  }
</script>
