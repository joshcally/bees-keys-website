<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Instagram card source (square): Frog’s Autumn Journey</title>
<!--
  Square (1080x1080) version of the Instagram post: the zoomed stones strip
  sits right under the title and the two sheets, smaller, spread out below
  it (Kristianna, Nov 9). Render it with:

    python3 -m http.server 8000
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars --window-size=1080,1080 \
      --virtual-time-budget=5000 \
      --screenshot=output/interval-jump-frogs-autumn-journey-ig-square.png \
      http://localhost:8000/tools/ig-card-interval-jump-frogs-autumn-journey-square.html

  The Bee's Friendsgiving card restacked for Interval Jump: the river-sky
  headline over the worksheet's own river painting, blurred, the zoomed
  crop of the first two stones (fall-stream-art/stones-crop.png, 450 dpi),
  then the two sheets, fanned wider than the cover fans them (Kristianna: "spread out the fan a bit"): the color
  beginner sheet in front, the black-and-white intermediate sheet behind
  and to the right, each placed on its own here rather than using the
  cover builder's fan PNG. Site address alone on the gold pill.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    position: relative;
    font-family: 'Nunito', sans-serif;
    color: #232323;
    background: #e8c27a;
  }

  /* The worksheet's own river painting (Kristianna's ChatGPT scene, leaf
     painted out), cover-fit and blurred a touch (her ask, Nov 9), oversized
     so the blur has no soft edge at the frame. */
  .bg {
    position: absolute;
    inset: -24px;
    background: url("fall-stream-art/autumn-river-clean.png") center / cover no-repeat;
    filter: blur(7px);
  }

  .inner {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 50px 60px 48px;
  }

  .brand { display: flex; align-items: center; gap: 13px; }
  .brand img { width: 52px; border-radius: 12px; }
  .brand span { font-weight: 800; font-size: 31px; letter-spacing: -.02em; }

  .eyebrow {
    margin-top: 18px;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: #b8651a;
  }

  h1 {
    margin-top: 10px;
    font-size: 66px;
    font-weight: 900;
    line-height: 1.03;
    letter-spacing: -.028em;
    text-shadow: 0 1px 0 rgba(255,255,255,.4);
  }
  /* "Autumn" in the deep red of the painting's background trees (sampled),
     "Journey" in the orange of its foreground trees (Kristianna, Nov 9). */
  h1 em { font-style: normal; color: #cd4722; }
  h1 em b { font-weight: inherit; color: #f08808; }

  /* Right under the title: the first two stones, blown up, on a white mat. */
  .zoom {
    display: block;
    width: 640px;
    margin-top: 36px;
    border: 12px solid #fff;
    border-radius: 12px;
    outline: 1px solid rgba(0,0,0,.14);
    box-shadow: 0 14px 32px rgba(31,33,28,.3);
    transform: rotate(-2deg);
  }

  /* Below it, the two sheets spread wide, smaller. */
  .stack { position: relative; flex: 1; width: 100%; margin-top: 6px; }

  .stack img {
    position: absolute;
    top: 50%;
    left: 50%;
    border-radius: 10px;
    border: 10px solid #fff;
    outline: 1px solid rgba(0,0,0,.12);
    background: #fff;
    box-shadow: 0 16px 36px rgba(31,33,28,.3);
  }
  /* The white sheet is its own mat, so no extra border on it (like the Friendsgiving card). */
  .stack .sheet-back  { width: 420px; border: 0; transform: translate(0%, -56%) rotate(5deg); }
  .stack .sheet-front { width: 450px; transform: translate(-100%, -48%) rotate(-4deg); }

  .foot { display: flex; justify-content: center; }

  .free {
    background: linear-gradient(180deg, #fde08a 0%, #f5c842 46%, #eda92a 100%);
    color: #2a2208;
    font-weight: 800;
    font-size: 23px;
    padding: 13px 30px;
    border-radius: 999px;
    border: 1px solid rgba(180,120,20,.35);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 6px 14px rgba(160,110,20,.28);
  }
</style>
</head>
<body>

  <div class="bg"></div>

  <div class="inner">
    <div class="brand">
      <img src="../images/intervaljump-icon.png" alt="" />
      <span>Interval Jump</span>
    </div>

    <p class="eyebrow">Free printable</p>
    <h1>Frog&rsquo;s <em>Autumn <b>Journey</b></em></h1>

    <img class="zoom" src="fall-stream-art/stones-crop.png" alt="" />

    <div class="stack">
      <img class="sheet-back"  src="../images/resources/interval-jump-frogs-autumn-journey-intervals-bw.jpg" alt="" />
      <img class="sheet-front" src="../images/resources/interval-jump-frogs-autumn-journey-sheet.jpg" alt="" />
    </div>

    <div class="foot">
      <span class="free">beeskeysapp.com</span>
    </div>
  </div>

</body>
</html>
