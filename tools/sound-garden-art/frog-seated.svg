          <path id="rear-leg-right" transform="translate(6 0)" d="M363 288 C388 259 429 257 454 280 C480 303 477 340 453 366 C436 385 413 394 392 389 C396 399 405 407 416 412 C435 414 454 419 462 427 C470 435 465 444 456 444 C446 444 438 436 429 429 C437 441 433 452 424 454 C414 456 406 445 400 435 C403 450 395 459 385 458 C374 457 369 442 367 429 C362 439 353 445 345 439 C336 432 343 420 351 409 C360 394 358 372 354 351 C345 334 340 316 345 303 C348 297 354 292 363 288 Z" fill="url(#green-limb)" stroke="#2c5b12" stroke-width="9"/>
          <path id="rear-foot-highlight-left" transform="translate(-6 0)" d="M69 427 C87 418 108 416 125 412" fill="none" stroke="#c8ed49" stroke-width="7" opacity=".45"/>
          <path id="rear-foot-highlight-right" transform="translate(6 0)" d="M451 427 C433 418 412 416 395 412" fill="none" stroke="#c8ed49" stroke-width="7" opacity=".45"/>
        </g>
        <path id="knee-line-left" transform="translate(-6 0)" d="M87 326 C109 340 125 355 137 373" fill="none" stroke="#5f9e0c" stroke-width="7"/>
        <path id="knee-line-right" transform="translate(6 0)" d="M433 326 C411 340 395 355 383 373" fill="none" stroke="#5f9e0c" stroke-width="7"/>
        <ellipse id="knee-highlight-left" cx="91" cy="296" rx="27" ry="13" fill="#d0f159" opacity=".42" transform="rotate(-22 91 296)"/>
        <ellipse id="knee-highlight-right" cx="429" cy="296" rx="27" ry="13" fill="#d0f159" opacity=".42" transform="rotate(22 429 296)"/>
      </g>

      <g id="torso">
        <path id="torso-shape" d="M153 246 C161 222 185 205 217 199 C245 194 275 194 303 199 C335 205 359 222 367 246 C378 279 374 337 360 374 C343 420 311 443 260 444 C209 443 177 420 160 374 C146 337 142 279 153 246 Z" fill="url(#green-main)" stroke="#2c5b12" stroke-width="9"/>
        <path id="torso-highlight" d="M161 260 C166 235 185 222 205 218 C186 251 181 311 190 353 C196 382 184 390 170 372 C151 346 150 296 161 260 Z" fill="#c2ed43" opacity=".45"/>
      </g>

      <g id="belly">
