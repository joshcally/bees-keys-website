        <path id="belly-band-upper" d="M195 310 C228 327 292 327 325 310" fill="none" stroke="#dfe56b" stroke-width="12" opacity=".55"/>
        <path id="belly-band-lower" d="M198 361 C229 381 291 381 322 361" fill="none" stroke="#92bf39" stroke-width="13" opacity=".45"/>
      </g>

      <g id="front-arms">
