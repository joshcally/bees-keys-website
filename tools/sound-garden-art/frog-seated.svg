<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-labelledby="title desc">
  <title id="title">Interval Jump frog traced from seated reference</title>
  <desc id="desc">Isolated seated green frog with modular body, limbs, belly, eyes, pupils, nose, mouth, brows, and cheeks.</desc>
  <defs>
    <linearGradient id="green-main" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aee20a"/><stop offset=".62" stop-color="#91d100"/><stop offset="1" stop-color="#69ad08"/>
    </linearGradient>
    <linearGradient id="green-limb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5e824"/><stop offset="1" stop-color="#7fc30a"/>
    </linearGradient>
    <linearGradient id="belly-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f29a"/><stop offset=".55" stop-color="#edf07c"/><stop offset="1" stop-color="#b4d94f"/>
    </linearGradient>
  </defs>

  <g id="frog" stroke-linecap="round" stroke-linejoin="round">
