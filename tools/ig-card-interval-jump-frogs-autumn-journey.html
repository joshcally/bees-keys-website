<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Instagram card source: Frog’s Autumn Journey</title>
<!--
  Source for the 1080x1350 Instagram post for the printable. Render it with:

    python3 -m http.server 8000
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars --window-size=1080,1350 \
      --virtual-time-budget=5000 \
      --screenshot=output/interval-jump-frogs-autumn-journey-ig.png \
      http://localhost:8000/tools/ig-card-interval-jump-frogs-autumn-journey.html

  The Bee's Friendsgiving card restacked for Interval Jump: the river-sky
  ground and bank from the Interval Jump OG cards, the headline, then a
  zoomed crop of the first two stones (fall-stream-art/stones-crop.png,
  cut from the color beginner sheet at 450 dpi, so the staff and the Step
  Up label read at feed size) behind the mixed two-sheet fan: the color
  beginner sheet over the black-and-white intermediate one, the same fan as
  the combined PDF's cover (images/resources/interval-jump-frogs-autumn-journey-fan.png,
  the cover builder's --mixed --art). Site address alone on the gold pill.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    position: relative;
    font-family: 'Nunito', sans-serif;
    color: #232323;
    background:
      radial-gradient(ellipse 70% 30% at 50% 90%, rgba(255,255,255,.6) 0%, rgba(120,206,240,.5) 30%, rgba(120,206,240,0) 70%),
      linear-gradient(180deg, #3f9ae6 0%, #79c4ee 34%, #b7e2f7 56%, #6fd0f2 78%, #15b8f1 92%);
  }

  .bank {
    position: absolute;
    left: -30px; right: -30px; bottom: -30px;
    height: 300px;
    filter: blur(9px);
  }
  .bank svg { width: 100%; height: 100%; display: block; }

  .cloud { position: absolute; opacity: .7; }
  .cloud-a { width: 170px; top: 4%; left: 6%; }
  .cloud-b { width: 120px; top: 9%; left: 78%; opacity: .5; }

  .inner {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 74px 60px 62px;
  }

  .brand { display: flex; align-items: center; gap: 13px; }
  .brand img { width: 52px; border-radius: 12px; }
  .brand span { font-weight: 800; font-size: 31px; letter-spacing: -.02em; }

  .eyebrow {
    margin-top: 26px;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: #b8651a;
  }

  h1 {
    margin-top: 10px;
    font-size: 74px;
    font-weight: 900;
    line-height: 1.03;
    letter-spacing: -.028em;
    text-shadow: 0 1px 0 rgba(255,255,255,.4);
  }
  /* The orange of the painting's foreground trees. */
  h1 em { font-style: normal; color: #f08808; }

  .stack { position: relative; flex: 1; width: 100%; margin-top: 10px; }

  .stack img {
    position: absolute;
    top: 50%;
    left: 50%;
  }

  /* Behind: the first two stones, blown up, on a white mat like a sheet. */
  .stack .zoom {
    width: 760px;
    border: 16px solid #fff;
    border-radius: 14px;
    outline: 1px solid rgba(0,0,0,.14);
    box-shadow: 0 18px 40px rgba(31,33,28,.32);
    transform: translate(-54%, -128%) rotate(-4deg);
  }

  /* In front: the color-over-B&W fan, already on its white rims with shadows. */
  .stack .fan {
    width: 1120px;
    transform: translate(-50%, -30%);
  }

  .foot { display: flex; justify-content: center; }

  .free {
    background: linear-gradient(180deg, #fde08a 0%, #f5c842 46%, #eda92a 100%);
    color: #2a2208;
    font-weight: 800;
    font-size: 23px;
    padding: 13px 30px;
    border-radius: 999px;
    border: 1px solid rgba(180,120,20,.35);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 6px 14px rgba(160,110,20,.28);
  }
</style>
</head>
<body>

  <div class="bank">
    <svg viewBox="0 0 1440 150" preserveAspectRatio="none">
      <path d="M0,44 C260,22 460,54 720,40 C980,26 1200,50 1440,32 L1440,150 L0,150 Z" fill="#bfe6a8" />
      <path d="M0,64 C300,46 520,74 780,60 C1040,46 1240,68 1440,56 L1440,150 L0,150 Z" fill="#9ed986" />
      <path d="M0,84 C320,72 560,94 820,82 C1080,70 1260,88 1440,78 L1440,150 L0,150 Z" fill="#7cc95f" />
      <path d="M0,102 C360,94 620,110 900,100 C1140,92 1300,104 1440,98 L1440,150 L0,150 Z" fill="#5fb841" />
    </svg>
  </div>

  <img src="../images/cloud1.svg" alt="" class="cloud cloud-a" />
  <img src="../images/cloud2.svg" alt="" class="cloud cloud-b" />

  <div class="inner">
    <div class="brand">
      <img src="../images/intervaljump-icon.png" alt="" />
      <span>Interval Jump</span>
    </div>

    <p class="eyebrow">Free printable</p>
    <h1>Frog&rsquo;s <em>Autumn Journey</em></h1>

    <div class="stack">
      <img class="zoom" src="fall-stream-art/stones-crop.png" alt="" />
      <img class="fan"  src="../images/resources/interval-jump-frogs-autumn-journey-fan.png" alt="" />
    </div>

    <div class="foot">
      <span class="free">beeskeysapp.com</span>
    </div>
  </div>

</body>
</html>
