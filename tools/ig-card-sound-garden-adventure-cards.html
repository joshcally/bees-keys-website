<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>IG card source — Bee's Sound Garden</title>
<!--
  The 1080x1350 social card for the Bee's Sound Garden printable. The PNG is
  not committed - render it into output/ with:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars --window-size=1080,1350 \
      --virtual-time-budget=5000 \
      --screenshot=output/sound-garden-adventure-cards-ig.png \
      "file://$PWD/tools/ig-card-sound-garden-adventure-cards.html"

  Same sky-to-meadow ground as tools/og-card.html and the other printable
  cards, so they read as one family.

  Unlike the earlier cards, the hero is single cards rather than a whole
  sheet of nine: at a phone's thumbnail size a sheet is just grey texture,
  and one card's art is the thing worth looking at. Two rows of three, tilted
  a little so they read as loose cards on a table: four illustrated (a bright
  daytime card, the bee mascot, a night card for the colour contrast, and one
  more) and two blanks from the color-your-own deck, one of them the dirt
  background, so the second deck is shown rather than described. Composed in
  PIL (see images/resources/sound-garden-adventure-cards-fan.png) on
  transparency, so each card's shadow falls on the sky and the meadow.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    position: relative;
    font-family: 'Nunito', sans-serif;
    color: #232323;
    background:
      radial-gradient(ellipse 66% 40% at 50% 88%, rgba(255,255,255,.85) 0%, rgba(251,227,142,.72) 28%, rgba(251,227,142,0) 70%),
      linear-gradient(180deg, #3f9ae6 0%, #79c4ee 30%, #b7e2f7 52%, #fbe38e 76%, #f7d067 90%);
  }

  .meadow {
    position: absolute;
    left: -30px; right: -30px; bottom: -20px;
    height: 260px;
    filter: blur(9px);
  }
  .meadow svg { width: 100%; height: 100%; display: block; }

  .cloud { position: absolute; opacity: .7; }
  .cloud-a { width: 170px; top: 5%;  left: 6%; }
  .cloud-b { width: 120px; top: 5%; left: 82%; opacity: .45; }

  .inner {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 56px 26px 46px;
  }

  .brand { display: flex; align-items: center; gap: 13px; }
  .brand img { width: 52px; }
  .brand span { font-weight: 800; font-size: 31px; letter-spacing: -.02em; }

  .eyebrow {
    margin-top: 24px;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: #b8651a;
  }

  h1 {
    margin-top: 8px;
    font-size: 68px;
    font-weight: 900;
    line-height: 1.03;
    letter-spacing: -.028em;
    text-shadow: 0 1px 0 rgba(255,255,255,.4);
  }
  h1 em { font-style: normal; color: #2f6b23; }

  .sub {
    margin-top: 12px;
    font-size: 26px;
    font-weight: 800;
    color: #2f6b23;
  }
  .sub-2 {
    margin-top: 6px;
    font-size: 22px;
    font-weight: 700;
    color: #3c4a44;
  }

  /* The cards themselves, fanned like a hand: a transparent PNG so their
     shadows fall on the sky and meadow rather than in a pasted white box. */
  .stack {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
  }
  .stack img { width: 1028px; max-width: 100%; max-height: 100%; height: auto; }

  .foot {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .free {
    background: linear-gradient(180deg, #fde08a 0%, #f5c842 46%, #eda92a 100%);
    color: #2a2208;
    font-weight: 800;
    font-size: 23px;
    padding: 13px 30px;
    border-radius: 999px;
    border: 1px solid rgba(180,120,20,.35);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 6px 14px rgba(160,110,20,.28);
  }

  .handle {
    font-size: 24px;
    font-weight: 800;
    color: #2f4a2a;
  }
</style>
</head>
<body>

  <div class="meadow">
    <svg viewBox="0 0 1440 150" preserveAspectRatio="none">
      <path d="M0,44 C260,22 460,54 720,40 C980,26 1200,50 1440,32 L1440,150 L0,150 Z" fill="#d3ecb2" />
      <path d="M0,64 C300,46 520,74 780,60 C1040,46 1240,68 1440,56 L1440,150 L0,150 Z" fill="#b3de8b" />
      <path d="M0,84 C320,72 560,94 820,82 C1080,70 1260,88 1440,78 L1440,150 L0,150 Z" fill="#93cf63" />
      <path d="M0,102 C360,94 620,110 900,100 C1140,92 1300,104 1440,98 L1440,150 L0,150 Z" fill="#7cc142" />
    </svg>
  </div>

  <img src="../images/cloud1.svg" alt="" class="cloud cloud-a" />
  <img src="../images/cloud2.svg" alt="" class="cloud cloud-b" />

  <div class="inner">
    <div class="brand">
      <img src="../images/bee_icon.png" alt="" />
      <span>Bees Keys</span>
    </div>

    <p class="eyebrow">Free printable</p>
    <h1>Bee's Sound <em>Garden</em></h1>
    <p class="sub">Explore improvisation right at the beginning!</p>
    <p class="sub-2">18 cards, plus a blank deck to draw your own.</p>

    <div class="stack">
      <img src="../images/resources/sound-garden-adventure-cards-fan.png" alt="" />
    </div>

    <div class="foot">
      <span class="free">Free · no sign-up</span>
      <span class="handle">beeskeysapp.com</span>
    </div>
  </div>

</body>
</html>
