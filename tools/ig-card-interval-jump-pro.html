<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Instagram / ad card source — Interval Jump Pro</title>
<!--
  Source for the 1080x1350 social post and paid promo for Interval Jump Pro.
  Render it with:

    python3 -m http.server 8000
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars --window-size=1080,1350 \
      --virtual-time-budget=5000 \
      --screenshot=interval-jump-pro-instagram.png \
      http://localhost:8000/tools/ig-card-interval-jump-pro.html

  Change --window-size alone for the square placement: 1080,1080.

  Deliberately the same card as ig-card-interval-jump-bug-collection.html —
  same parchment ground, same washes, same type scale, same gold pill — with
  the game screenshot where the fan of sheets goes. An earlier version put this
  one on the app's blue sky and water, and the result read as a Bees Keys card:
  that sky-over-ground treatment is the Bees Keys house style, and using it here
  made the Interval Jump pair look like two different studios. The parchment is
  what makes them a set, so it stays whatever the card is selling.

  The headline is from Josh's App Store creative ("Take on new challenges"). The
  perk strip under the screenshot is the paywall's own four lines in the
  paywall's own words (`view/settings/PaywallScreen.swift`) — this is the card
  that asks for money, so what it promises has to be exactly what the purchase
  unlocks. If a perk is edited there, edit it here.

  No price. The paywall shows StoreKit's localized `displayPrice` and only falls
  back to $3.99, so a hardcoded number would be wrong in most storefronts the
  moment the ad runs outside the US. "One-time unlock, no subscription" is the
  part that is true everywhere, and it is the stronger line anyway.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    /* Viewport-sized so 1080x1350 and 1080x1080 both compose from this file.
       The screenshot is the flexible row. */
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
    font-family: 'Nunito', sans-serif;
    color: #373936;
    /* Parchment cream and gold, from the collection cards
       (`view/common/SegmentedPicker.swift`). Identical to the sheets card. */
    background:
      radial-gradient(ellipse 70% 42% at 50% 60%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.5) 34%, rgba(255,255,255,0) 72%),
      linear-gradient(180deg, #FDF9EC 0%, #FAF2D6 42%, #F6E7B6 78%, #F0DA9C 100%);
  }

  .wash { position: absolute; border-radius: 50%; pointer-events: none; }
  .wash-a {
    width: 620px; height: 620px; top: -230px; right: -200px;
    background: radial-gradient(circle, rgba(238,172,45,.20) 0%, rgba(238,172,45,0) 70%);
  }
  .wash-b {
    width: 560px; height: 560px; bottom: -190px; left: -180px;
    background: radial-gradient(circle, rgba(17,142,185,.16) 0%, rgba(17,142,185,0) 70%);
  }

  .inner {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 70px 56px 60px;
  }

  .brand { display: flex; align-items: center; gap: 13px; }
  .brand img { width: 52px; border-radius: 11px; }
  .brand span { font-weight: 800; font-size: 31px; letter-spacing: -.02em; }

  .eyebrow {
    margin-top: 24px;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: #8C5E2E;
  }

  h1 {
    margin-top: 8px;
    font-size: 76px;
    font-weight: 900;
    line-height: 1.0;
    letter-spacing: -.03em;
    text-shadow: 0 1px 0 rgba(255,255,255,.55);
  }
  h1 em { font-style: normal; color: #118EB9; }

  .sub {
    margin-top: 16px;
    font-size: 27px;
    font-weight: 700;
    color: #6b6f68;
  }

  /* The game, floating on the parchment the way the sheets do. */
  .stack {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 10px;
  }
  .stack img {
    width: 940px;
    max-width: 100%;
    max-height: 100%;
    height: auto;
    border-radius: 18px;
    border: 6px solid #fff;
    box-shadow: 0 18px 40px rgba(31,33,28,.28);
  }

  /* The paywall's four lines, as a strip rather than four boxes — boxes would
     be furniture the sheets card does not have, and the pair has to match. Two
     per line, broken by hand: left to wrap on its own the fourth perk splits
     and strands "bugs" alone on a centred line. */
  .perks {
    margin-top: 22px;
    font-size: 21px;
    font-weight: 800;
    color: #8C5E2E;
    line-height: 1.5;
    max-width: 880px;
  }
  .perks .dot { color: #EEAC2D; margin: 0 10px; }

  .foot { margin-top: 22px; display: flex; align-items: center; gap: 18px; }

  .free {
    background: linear-gradient(180deg, #fde08a 0%, #f5c842 46%, #eda92a 100%);
    color: #2a2208;
    font-weight: 800;
    font-size: 23px;
    padding: 13px 30px;
    border-radius: 999px;
    border: 1px solid rgba(180,120,20,.35);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 6px 14px rgba(160,110,20,.28);
  }

  .handle { font-size: 24px; font-weight: 800; color: #8C5E2E; }
</style>
</head>
<body>

  <div class="wash wash-a"></div>
  <div class="wash wash-b"></div>

  <div class="inner">
    <div class="brand">
      <img src="../images/intervaljump-icon.png" alt="" />
      <span>Interval Jump</span>
    </div>

    <p class="eyebrow">Interval Jump Pro</p>
    <h1>Take on new <em>challenges</em></h1>
    <p class="sub">Unlock the whole river.</p>

    <div class="stack">
      <img src="../images/resources/interval-jump-bug-collection-game.jpg" alt="" />
    </div>

    <p class="perks">
      4th–9th intervals <span class="dot">·</span> Custom practice sessions<br />
      All timers &amp; controls <span class="dot">·</span> Catch river bugs
    </p>

    <div class="foot">
      <span class="free">One-time unlock · no subscription</span>
      <span class="handle">On the App Store</span>
    </div>
  </div>

</body>
</html>
