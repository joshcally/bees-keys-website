<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Instagram / ad card source — Interval Jump Pro</title>
<!--
  Source for the 1080x1350 social post and paid promo for Interval Jump Pro.
  Render it with:

    python3 -m http.server 8000
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars --window-size=1080,1350 \
      --virtual-time-budget=5000 \
      --screenshot=interval-jump-pro-instagram.png \
      http://localhost:8000/tools/ig-card-interval-jump-pro.html

  Change --window-size alone for the square placement: 1080,1080.

  The companion to ig-card-interval-jump-bug-collection.html: same skeleton, so
  the two sit together in a grid, but the opposite ground. The printable card is
  cream parchment because the printable is paper; this one is the app, so it is
  the app's own river and sky. Run as a pair, the sheets ad sells the free thing
  and this one sells the upgrade.

  The headline is from Josh's App Store creative ("Take on new challenges"), and
  the perks are the paywall's own four lines, in the paywall's own words
  (`view/settings/PaywallScreen.swift`). That matters more here than anywhere
  else on the site: this is the card that asks for money, so what it promises
  has to be exactly what the purchase unlocks. If a perk is edited there, edit
  it here.

  No price. The paywall shows StoreKit's localized `displayPrice` and only falls
  back to $3.99, so a hardcoded number would be wrong in most storefronts the
  moment the ad runs outside the US. "One-time unlock, no subscription" is the
  part that is true everywhere, and it is the stronger line anyway.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    /* Viewport-sized so 1080x1350 and 1080x1080 both compose from this file —
       see the note in the sheets card. The screenshot is the flexible row. */
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
    font-family: 'Nunito', sans-serif;
    color: #1d3b2a;
    /* Sky over water, in the app's azul (`colors/*.colorset`). Deliberately
       just those two: an earlier version put the green bank in here too, and it
       read as a smear either side of the screenshot, which paints its own bank
       far better. */
    background:
      linear-gradient(180deg, #8fd3f4 0%, #bfe6f7 26%, #7fd2f0 56%, #3cb6ea 80%, #15b8f1 100%);
  }

  .cloud { position: absolute; opacity: .8; }
  .cloud-a { width: 210px; top: 4%;  left: 5%; }
  .cloud-b { width: 150px; top: 10%; left: 76%; opacity: .55; }

  .inner {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 62px 52px 54px;
  }

  .brand { display: flex; align-items: center; gap: 13px; }
  .brand img { width: 52px; border-radius: 11px; }
  .brand span { font-weight: 800; font-size: 31px; letter-spacing: -.02em; color: #14432c; }

  .eyebrow {
    margin-top: 20px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #0d5f7d;
  }

  h1 {
    margin-top: 8px;
    font-size: 74px;
    font-weight: 900;
    line-height: 1.0;
    letter-spacing: -.03em;
    color: #16213a;
    text-shadow: 0 2px 0 rgba(255,255,255,.45);
  }
  h1 em { font-style: normal; color: #2f7d20; }

  /* The game itself, in a rounded frame. */
  .shot {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 26px;
  }
  .shot img {
    width: 900px;
    max-width: 100%;
    max-height: 100%;
    height: auto;
    border-radius: 20px;
    border: 5px solid #fff;
    box-shadow: 0 18px 40px rgba(12,40,25,.32);
  }

  /* The paywall's four lines, two up two down. */
  .perks {
    margin-top: 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
  }

  .perk {
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    background: rgba(255,255,255,.93);
    border-radius: 16px;
    padding: 14px 18px;
    box-shadow: 0 4px 12px rgba(12,40,25,.16);
  }

  .perk .tick {
    flex: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: linear-gradient(180deg, #ffd940 0%, #f29900 100%);
    color: #fff;
    font-size: 17px;
    font-weight: 900;
    line-height: 30px;
    text-align: center;
  }

  .perk span { font-size: 22px; font-weight: 800; color: #1d3b2a; line-height: 1.15; }

  .foot { margin-top: 24px; display: flex; align-items: center; gap: 18px; }

  .buy {
    background: linear-gradient(180deg, #fde08a 0%, #f5c842 46%, #eda92a 100%);
    color: #2a2208;
    font-weight: 800;
    font-size: 23px;
    padding: 13px 30px;
    border-radius: 999px;
    border: 1px solid rgba(180,120,20,.35);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 6px 14px rgba(120,80,10,.3);
  }

  .handle { font-size: 24px; font-weight: 800; color: #10405a; }
</style>
</head>
<body>

  <img src="../images/cloud1.svg" alt="" class="cloud cloud-a" />
  <img src="../images/cloud2.svg" alt="" class="cloud cloud-b" />

  <div class="inner">
    <div class="brand">
      <img src="../images/intervaljump-icon.png" alt="" />
      <span>Interval Jump</span>
    </div>

    <p class="eyebrow">Interval Jump Pro</p>
    <h1>Take on new <em>challenges</em></h1>

    <div class="shot">
      <img src="../images/resources/interval-jump-bug-collection-game.jpg" alt="" />
    </div>

    <div class="perks">
      <div class="perk"><i class="tick">✓</i><span>4th–9th intervals</span></div>
      <div class="perk"><i class="tick">✓</i><span>Custom practice sessions</span></div>
      <div class="perk"><i class="tick">✓</i><span>All timers &amp; controls</span></div>
      <div class="perk"><i class="tick">✓</i><span>Catch river bugs</span></div>
    </div>

    <div class="foot">
      <span class="buy">One-time unlock · no subscription</span>
      <span class="handle">On the App Store</span>
    </div>
  </div>

</body>
</html>
