<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Card game cover source — Find Every Key</title>
<!--
  Source for the Find Every Key card game cover — portrait 5:7, the standard
  flash-card shape. Render it with:

    python3 -m http.server 8000
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars --window-size=1080,1512 \
      --force-device-scale-factor=2 --virtual-time-budget=5000 \
      --screenshot=find-every-key-cover.png \
      http://localhost:8000/tools/card-cover-find-every-key.html

  Built from the site's own elements — the layered bee SVGs, the og-card
  sky-to-meadow ground, the clouds, Nunito — so the box matches the app and
  the printables. The magnifying glass is drawn here in the bee art's own
  outline style (#1c1c18, round caps).
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1512px;
    overflow: hidden;
    background: #fff;
    font-family: 'Nunito', sans-serif;
  }

  .card {
    position: relative;
    width: 1080px;
    height: 1512px;
    overflow: hidden;
    border-radius: 44px;
    color: #232323;
    background: linear-gradient(180deg, #3f9ae6 0%, #79c4ee 52%, #b7e2f7 100%);
  }

  /* Faint inner frame, like a printed box edge. */
  .card::after {
    content: "";
    position: absolute;
    inset: 18px;
    border-radius: 30px;
    border: 3px solid rgba(255,255,255,.55);
    pointer-events: none;
    z-index: 9;
  }

  .cloud { position: absolute; opacity: .75; }
  .cloud-a { width: 180px; top: 4.5%; left: 6%; }
  .cloud-b { width: 120px; top: 12%;  left: 78%; opacity: .5; }

  .inner {
    position: relative;
    z-index: 2;
    height: 100%;
    text-align: center;
    padding-top: 252px;
  }

  /* Brand mark, moved to the floor of the card. */
  h1 {
    position: absolute;
    z-index: 2;
    left: 0; right: 0;
    bottom: 74px;
    text-align: center;
    font-size: 60px;
    font-weight: 900;
    line-height: .95;
    letter-spacing: -.01em;
    color: #232323;
    text-shadow: 0 1px 0 rgba(255,255,255,.4);
  }

  .sub {
    margin-top: 14px;
    font-size: 144px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -.02em;
    text-transform: uppercase;
    color: #fdd835;
    -webkit-text-stroke: 7px #1c1c18;
    paint-order: stroke fill;
    text-shadow: 0 6px 14px rgba(31,33,24,.25);
  }

  .sub .key {
    display: block;
    font-size: 200px;
    letter-spacing: .02em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* The site's bee: body + two wings share one viewBox, wings pinned at the
     app's pivot and frozen mid-flap. Flipped to fly rightward, away from the
     trail it leaves behind. */
  .bee {
    position: absolute;
    z-index: 5;
    width: 470px;
    left: 285px;
    bottom: 330px;
    transform: scaleX(-1) rotate(5deg);
  }
  .bee img { width: 100%; display: block; }
  .bee .wing {
    position: absolute;
    inset: 0;
    transform-origin: 51.6% 55.6%;
  }
  .bee .wing-back  { transform: rotate(30deg); }
  .bee .wing-front { transform: rotate(-12deg); }

  /* Magnifying glass held ahead of the bee: the grip end of the handle sits
     at the bee's front legs, the glass head reaches down-forward. */
  .glass {
    position: absolute;
    z-index: 6;
    width: 330px;
    left: 636px;
    bottom: 258px;
  }

  /* Dashed flight trail wandering in from the left, trailing off behind the bee. */
  .trail {
    position: absolute;
    z-index: 1;
    left: -10px;
    bottom: 560px;
    width: 620px;
    height: 430px;
  }
</style>
</head>
<body>
<div class="card">

  <img src="../images/cloud1.svg" alt="" class="cloud cloud-a" />
  <img src="../images/cloud2.svg" alt="" class="cloud cloud-b" />

  <svg class="trail" viewBox="0 0 620 430" fill="none">
    <path d="M14,60
             C 150,160 260,40 330,120
             C 380,175 330,240 250,230
             C 175,220 180,300 260,320
             C 330,338 395,365 448,398"
          stroke="#6b6428" stroke-opacity=".5" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="22 26" />
  </svg>

  <div class="inner">
    <p class="sub">Find Every <span class="key">Key</span></p>
  </div>

  <h1>Bees Keys</h1>

  <div class="bee">
    <img src="../images/bee-body.svg" alt="" />
    <img src="../images/back-wing.svg" alt="" class="wing wing-back" />
    <img src="../images/front-wing.svg" alt="" class="wing wing-front" />
  </div>

  <svg class="glass" viewBox="0 0 240 260">
    <!-- handle: grip end down-left toward the bee, glass head raised -->
    <g transform="rotate(45 150 90)">
      <rect x="138" y="152" width="24" height="108" rx="11"
            fill="#8a5a2b" stroke="#1c1c18" stroke-width="5" />
    </g>
    <!-- rim + glass -->
    <circle cx="150" cy="90" r="62" fill="#eaf6fd" fill-opacity=".9"
            stroke="#1c1c18" stroke-width="9" />
    <circle cx="150" cy="90" r="47" fill="none"
            stroke="#ffffff" stroke-opacity=".8" stroke-width="7" />
    <path d="M118,72 A 42 42 0 0 1 136,54" fill="none"
          stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
  </svg>



</div>
</body>
</html>
